<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolffia</title>
  </head>

  <body>
    <main
      class="flex h-screen min-h-0 bg-[radial-gradient(circle_at_76%_38%,#1a1f1a_0%,#121712_40%,var(--canvas)_100%)]"
    >
      <aside
        id="list"
        class="flex min-w-0 flex-col overflow-hidden border-r border-(--line) bg-[rgba(21,23,21,0.84)] px-0 pb-5 pt-4"
      >
        <header
          class="flex shrink-0 items-center gap-1.5 border-b border-(--line) py-3 pr-3 pl-7.75"
        >
          <i
            data-lucide="list"
            class="block h-4.5 w-4.5 text-(--accent)"
            aria-hidden="true"
          ></i>
          <h1
            class="m-0 min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[16px] font-semibold leading-[1.4] tracking-[-0.01em] text-(--text-strong)"
          >
            播放列表
          </h1>
          <span
            id="playlist-count"
            class="shrink-0 rounded-full bg-[rgba(215,221,214,0.07)] px-2 py-0.75 text-[13px] font-medium leading-none tracking-[0.04em] text-(--faint) tabular-nums"
            >0 首</span
          >
        </header>
        <div id="songs" class="min-h-0 flex-1 overflow-y-auto pb-3"></div>
        <div
          id="song-context-menu"
          class="song-context-menu"
          role="menu"
          hidden
        >
          <button type="button" role="menuitem" data-action="open-in-explorer">
            在资源管理器中打开
          </button>
          <button type="button" role="menuitem" data-action="show-properties">
            属性
          </button>
        </div>
      </aside>
      <div
        id="list-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整列表宽度"
        title="拖拽调整列表宽度（双击复位）"
        tabindex="0"
      ></div>
      <section
        id="player-zone"
        class="flex min-w-0 flex-1 flex-col items-center px-10 pt-10.5 max-[760px]:px-5.5 max-[760px]:pt-8"
      >
        <header
          id="player-header"
          class="-mx-10 flex w-[calc(100%+80px)] shrink-0 self-stretch items-center justify-center gap-2.5 border-b border-(--line) px-10 pb-4 max-[760px]:-mx-5.5 max-[760px]:w-[calc(100%+44px)] max-[760px]:px-5.5"
        >
          <div class="eq-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h2
            id="current-title"
            class="m-0 min-w-0 flex-1 overflow-hidden text-[clamp(17px,2vw,22px)] font-semibold tracking-[-0.02em] text-[#c9ccc6]"
          >
            <span id="title-text" class="title-text">双击选择文件夹</span>
          </h2>
        </header>
        <div
          id="lyrics-area"
          class="relative -mx-10 min-h-0 w-[calc(100%+80px)] flex-1 self-stretch overflow-hidden max-[760px]:-mx-5.5 max-[760px]:w-[calc(100%+44px)]"
        >
          <div id="lyrics-bg" class="lyrics-bg" aria-hidden="true"></div>
          <div
            id="lyrics-art-empty"
            class="lyrics-art-empty"
            aria-live="polite"
          >
            暂无专辑图
          </div>
          <button
            id="lyrics-art-toggle"
            class="lyrics-art-toggle"
            type="button"
            aria-label="显示专辑图"
            title="显示专辑图"
          >
            <i data-lucide="image" aria-hidden="true"></i>
          </button>
          <div
            id="lyrics-container"
            class="absolute inset-0 overflow-hidden text-center mask-[linear-gradient(transparent,black_18%,black_82%,transparent)]"
          >
            <div
              id="lyrics-wrapper"
              class="absolute top-1/2 w-full px-6 transition-[top] duration-300 ease-in-out"
            ></div>
          </div>
        </div>
        <div
          class="player-controls -mx-10 flex w-[calc(100%+80px)] shrink-0 items-center gap-3.5 self-stretch border-t border-(--line) bg-[rgba(19,24,19,0.6)] px-10 pb-6 pt-4 shadow-[0_-12px_32px_rgba(0,0,0,0.22)] backdrop-blur-xl max-[760px]:-mx-5.5 max-[760px]:w-[calc(100%+44px)] max-[760px]:gap-2 max-[760px]:px-5.5 max-[760px]:pb-5"
          aria-label="播放控制"
        >
          <button
            id="play-toggle"
            class="play-toggle grid h-10 w-10 shrink-0 place-items-center rounded-full border-0 bg-(--accent) p-0 text-[#182018] transition-[transform,background] duration-150 hover:scale-105 hover:bg-[#c4e0bc] active:scale-95"
            type="button"
            aria-label="播放"
            title="播放 (空格)"
          >
            <i
              data-lucide="play"
              class="icon-play block h-4.5 w-4.5"
              aria-hidden="true"
            ></i>
            <i
              data-lucide="pause"
              class="icon-pause block h-4.5 w-4.5"
              aria-hidden="true"
            ></i>
          </button>
          <span
            id="current-time"
            class="w-11 shrink-0 text-right text-[11px] tabular-nums tracking-[0.04em] text-(--faint)"
            >00:00</span
          >
          <input
            id="progress"
            class="progress min-w-0 flex-1"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="播放进度"
          />
          <span
            id="duration"
            class="w-11 shrink-0 text-left text-[11px] tabular-nums tracking-[0.04em] text-(--faint)"
            >00:00</span
          >
          <div class="speed-control relative flex shrink-0 items-center">
            <button
              id="playback-rate-toggle"
              class="speed-toggle flex min-w-13.75 items-center justify-between gap-1.5 rounded-full border border-[rgba(215,221,214,0.12)] bg-[rgba(215,221,214,0.06)] px-2.5 py-1.5 text-[11px] font-medium tracking-[0.02em] text-(--muted) transition-[border-color,background,color] duration-150 hover:border-[rgba(169,201,160,0.5)] hover:bg-(--accent-soft) hover:text-(--text-strong)"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="播放速度"
              title="播放速度"
            >
              <span id="playback-rate-label">1x</span>
              <i
                data-lucide="chevron-up"
                class="speed-chevron block h-3.25 w-3.25 transition-transform duration-150"
                aria-hidden="true"
              ></i>
            </button>
            <div
              id="playback-rate-menu"
              class="speed-menu absolute bottom-[calc(100%+10px)] right-0 z-5 grid min-w-21.5 gap-0.5 rounded-[10px] border border-[rgba(215,221,214,0.14)] bg-[rgba(29,36,30,0.98)] p-1.25 shadow-[0_12px_28px_rgba(0,0,0,0.32)] backdrop-blur-xl"
              role="menu"
              hidden
            >
              <button
                class="speed-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-rate="0.5"
              >
                0.5x
              </button>
              <button
                class="speed-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-rate="0.75"
              >
                0.75x
              </button>
              <button
                class="speed-option is-selected"
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-rate="1"
              >
                1x
              </button>
              <button
                class="speed-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-rate="1.25"
              >
                1.25x
              </button>
              <button
                class="speed-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-rate="1.5"
              >
                1.5x
              </button>
              <button
                class="speed-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-rate="2"
              >
                2x
              </button>
            </div>
          </div>
          <button
            id="loop-mode-toggle"
            class="loop-mode-toggle grid h-8 w-8 shrink-0 place-items-center rounded-lg border-0 bg-transparent p-0 text-(--muted) transition-[color,background] duration-150 hover:bg-[rgba(215,221,214,0.08)] hover:text-(--text-strong) [&_svg]:block [&_svg]:h-4 [&_svg]:w-4"
            type="button"
            aria-label="循环模式"
            title="循环模式"
          >
            <i
              data-lucide="list-music"
              class="icon-once"
              aria-hidden="true"
            ></i>
            <i data-lucide="repeat" class="icon-loop" aria-hidden="true"></i>
            <i data-lucide="shuffle" class="icon-random" aria-hidden="true"></i>
          </button>
          <button
            id="mute-toggle"
            class="icon-button grid h-8 w-8 shrink-0 place-items-center rounded-lg border-0 bg-transparent p-0 text-(--muted) transition-[color,background] duration-150 hover:bg-[rgba(215,221,214,0.08)] hover:text-(--text-strong) [&_svg]:block [&_svg]:h-4 [&_svg]:w-4"
            type="button"
            aria-label="静音"
            title="静音 (M)"
          >
            <i
              data-lucide="volume-2"
              class="icon-volume"
              aria-hidden="true"
            ></i>
            <i data-lucide="volume-x" class="icon-muted" aria-hidden="true"></i>
          </button>
          <div class="relative flex shrink-0 items-center">
            <input
              id="volume"
              class="volume block h-4 w-16 cursor-pointer appearance-none bg-transparent max-[760px]:w-12"
              type="range"
              min="0"
              max="1"
              value="1"
              step="0.01"
              aria-label="音量"
              title="音量 (↑/↓)"
            />
            <span id="volume-value" class="volume-bubble">100%</span>
          </div>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
